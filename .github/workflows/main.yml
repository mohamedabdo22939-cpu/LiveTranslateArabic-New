name: Build Android APK From Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip "$ZIP_FILE"
            # التحرك داخل المجلد المستخرج إذا وجد
            SUB_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; -print -quit)
            if [ -n "$SUB_DIR" ]; then
              cd "$SUB_DIR"
              chmod +x ./gradlew
              ./gradlew assembleDebug
              # نقل ملف الـ APK الناتج للمجلد الرئيسي ليسهل رفعه
              mkdir -p ../app/build/outputs/apk/debug/
              cp -r app/build/outputs/apk/debug/*.apk ../app/build/outputs/apk/debug/ || true
            fi
          else
            echo "Error: No zip file found in repository root!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslateArabic-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
