name: Generate and Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*project*.zip*" -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting code files..."
            mkdir -p extracted_code
            unzip "$ZIP_FILE" -d extracted_code/
          else
            echo "No zip file found, will look for standard files."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android Template Project
        run: |
          # تثبيت أداة توليد مشروعات الأندرويد القياسية
          sudo apt-get update && sudo apt-get install -y wget unzip
          
          # إنشاء هيكل مشروع أندرويد مصغر وسليم بملفات الجرادل
          mkdir -p android_project/app/src/main/java
          mkdir -p android_project/app/src/main/res
          cd android_project
          
          # تحميل ملفات الجرادل القياسية والأساسية (Gradle Wrapper)
          wget https://gradle.org
          unzip -q gradle-8.9-bin.zip
          mv gradle-8.9/* . || true
          
          # توليد ملفات البناء الأساسية القياسية للأندرويد
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = 'LiveTranslateArabic'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.4.0' apply false; id 'com.android.library' version '8.4.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.20' apply false }" > build.gradle
          echo -e "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }\nandroid { compileSdk 34\ndefaultConfig { applicationId \"com.example.livetranslatearabic\"; minSdk 24; targetSdk 34; versionCode 1; versionName \"1.0\" }\nbuildTypes { release { minifyEnabled false } } }\ndependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1' }" > app/build.gradle
          
          # توليد ملف تشغيل الجرادل الآلي gradlew
          echo -e '#!/usr/bin/env bash\nexport GRADLE_HOME=$(pwd)\n./bin/gradle "$@"' > gradlew
          chmod +x gradlew
          
          # دمج ملفات الأكواد الخاصة بك داخل هيكل الأندرويد القياسي
          if [ -d "../extracted_code" ]; then
            find ../extracted_code -name "AndroidManifest.xml" -exec cp {} app/src/main/ \;
            find ../extracted_code -name "*.kt" -exec cp {} app/src/main/java/ \;
            find ../extracted_code -name "*.xml" ! -name "AndroidManifest.xml" -exec cp {} app/src/main/res/ \;
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android_project
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslateArabic-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
